<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For You</title>
<style>
  :root {
    --wine: #5b1230;
    --rose: #e8557a;
    --blush: #ffe3ea;
    --paper: #fff8f6;
    --gold: #d9a441;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: radial-gradient(circle at 30% 20%, #ffd0dc 0%, #f7a1b8 45%, #c94b73 100%);
    color: var(--wine);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }

  .card {
    background: var(--paper);
    width: min(92vw, 420px);
    padding: 22px 22px 28px;
    border-radius: 6px;
    box-shadow: 0 24px 60px rgba(91, 18, 48, .35);
    text-align: center;
    position: relative;
    z-index: 2;
  }

  /* ---- Photo frame ---- */
  .photo {
    aspect-ratio: 4 / 5;
    background: var(--blush);
    border: 6px solid #fff;
    outline: 1px solid rgba(91, 18, 48, .2);
    display: grid;
    place-items: center;
    overflow: hidden;
    transform: rotate(-1.5deg);
    box-shadow: 0 8px 20px rgba(91, 18, 48, .25);
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo .placeholder { font-size: 64px; color: var(--rose); }

  h1 { font-size: 1.9rem; margin: 22px 0 6px; font-weight: 700; }
  .message {
    min-height: 3.2em;
    font-size: 1.05rem;
    line-height: 1.5;
    font-style: italic;
    margin-bottom: 20px;
    transition: opacity .25s;
  }

  /* ---- Button ---- */
  .love-btn {
    font: inherit;
    font-size: 1.05rem;
    background: var(--rose);
    color: #fff;
    border: 0;
    padding: 14px 30px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 0 #b83a5c;
    transition: transform .12s, box-shadow .12s;
  }
  .love-btn:hover { transform: translateY(-2px); }
  .love-btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #b83a5c; }
  .love-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }

  .count { margin-top: 14px; font-size: .9rem; opacity: .75; }

  /* ---- Floating hearts ---- */
  .heart {
    position: fixed;
    bottom: -40px;
    pointer-events: none;
    z-index: 1;
    animation: rise linear forwards;
  }
  @keyframes rise {
    to { transform: translateY(-115vh) rotate(25deg); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .heart { animation-duration: 0.01s !important; }
  }
</style>
</head>
<body>

<main class="card">
  <!-- 👇 PUT YOUR PHOTO HERE: save your picture next to this file as "our-photo.jpg"
       (or change the file name below). If it's missing, a heart shows instead. -->
  <div class="photo">
    <img src="IMG_20260921_163741.jpg" alt="Us together"
         onerror="this.remove(); this.parentNode.innerHTML='<span class=&quot;placeholder&quot;>♥</span>'">
  </div>

  <h1>Happy to have you, Lab</h1>
  <p class="message" id="message">Click the button. May sasabihin ako. </p>

  <button class="love-btn" id="btn">Tap if you love me</button>
  <p class="count" id="count"></p>
</main>

<script>
  // ✏️ EDIT THESE MESSAGES to say what you want
  const messages = [
    "You are my favorite person in the whole world.",
    "Every day with you feels like my best day.",
    "You make ordinary moments feel special.",
    "I'm so lucky it's you.",
    "Home is wherever you are.",
    "I love you more than words can say."
  ];

  const btn = document.getElementById("btn");
  const msg = document.getElementById("message");
  const count = document.getElementById("count");
  let taps = 0;

  function spawnHeart() {
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = ["♥", "❤", "💗", "💕"][Math.floor(Math.random() * 4)];
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = 18 + Math.random() * 28 + "px";
    h.style.color = Math.random() > .5 ? "#fff" : "#5b1230";
    h.style.animationDuration = 2.5 + Math.random() * 2.5 + "s";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 5500);
  }

  btn.addEventListener("click", () => {
    msg.style.opacity = 0;
    setTimeout(() => {
      msg.textContent = messages[taps % messages.length];
      msg.style.opacity = 1;
      taps++;
      count.textContent = "Love sent " + taps + (taps === 1 ? " time" : " times");
    }, 200);
    for (let i = 0; i < 14; i++) setTimeout(spawnHeart, i * 70);
  });
</script>
</body>
</html>
